name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-security:
    name: Build & Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Setup de Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # Ajusta esto a la versión de Java que use el pom.xml (probablemente 17 o 21)
          cache: 'maven'

      - name: 3. Compilación y Pruebas (CI)
        run: mvn clean package

      - name: 4. SAST - Escaneo con Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          # Forzamos la salida en JSON como pidió el ingeniero.
          # Agregamos "|| true" para que no bloquee el pipeline aquí y nos permita generar los demás reportes.
          semgrep scan --config auto --json --output semgrep-report.json || true

      - name: 5. Construir Imagen Docker del Proyecto
        # Trivy necesita analizar la imagen real de nuestro código, no una genérica.
        run: docker build -t spring-boot-webapi:latest .

      - name: 6. Instalar Trivy y Escanear Imagen
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          # Ejecutamos Trivy apuntando a la imagen que acabamos de construir.
          trivy image --format json --output trivy-report.json spring-boot-webapi:latest || true

      - name: 7. Publicar Reportes (Artifacts)
        if: always() # CRÍTICO: Asegura que se suban los reportes aunque los escáneres detecten fallos críticos
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            semgrep-report.json
            trivy-report.json